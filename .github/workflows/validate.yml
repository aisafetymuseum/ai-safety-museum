name: Museum inspection
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          node --check manifest.js
          find content exhibits rooms -name "*.js" -print0 2>/dev/null | xargs -0 -n1 node --check
      - name: Walk the building
        run: node scripts/validate.js
